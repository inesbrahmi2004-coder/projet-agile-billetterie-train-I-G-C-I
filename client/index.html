<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation de Billets de Train</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
    h1 { color: #2c3e50; }
    .search-box { background: white; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    button:hover { background: #219150; }
  </style>
</head>
<body>

  <h1>Rechercher un billet de train</h1>

  <div class="search-box">
    <form id="searchForm">
      <div class="form-group">
        <label for="departure">Gare de départ :</label>
        <input type="text" id="departure" placeholder="Ex: Paris Gare de Lyon" required>
      </div>

      <div class="form-group">
        <label for="arrival">Gare d'arrivée :</label>
        <input type="text" id="arrival" placeholder="Ex: Lyon Part-Dieu" required>
      </div>

      <div class="form-group">
        <label for="date">Date du voyage :</label>
        <input type="date" id="date" required>
      </div>

      <button type="submit">Rechercher les trains</button>
    </form>
  </div>

</body>
</html>
